<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1050" role="img" aria-labelledby="title description">
  <title id="title">ShopEase product image placeholder</title>
  <desc id="description">A neutral ShopEase placeholder shown when a product image is unavailable.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
  </defs>
  <rect width="900" height="1050" fill="url(#background)"/>
  <rect x="342" y="390" width="216" height="216" rx="62" fill="url(#mark)"/>
  <path d="M399 471h102l-10 92h-82l-10-92Zm22 0c0-24 13-42 30-42s30 18 30 42" fill="none" stroke="#fff" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
